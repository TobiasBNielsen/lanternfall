name: CrazyGames package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test the advert module
        run: node --test "tests/*.test.js"

      - name: Build the package
        run: bash deploy/crazygames.sh

      # Download this artifact and upload the zip in the CrazyGames developer portal.
      - uses: actions/upload-artifact@v4
        with:
          name: lanternfall-crazygames
          path: build/crazygames/
