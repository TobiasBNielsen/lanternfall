name: Deploy to Simply

on:
  push:
    branches: [main, move-to-simply]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Simply.com runs .NET apps self-contained as win-x86.
      - name: Publish
        run: dotnet publish server -c Release -r win-x86 --self-contained true -o publish

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # app_offline.htm stops the running app so its files can be replaced.
      - name: Take the site offline
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "${{ vars.FTP_USER }},$FTP_PASSWORD" "${{ vars.FTP_HOST }}" -e "set ftp:ssl-force true; set ssl:verify-certificate true; cd ${{ vars.FTP_DIR }}; mkdir -f logs; put deploy/app_offline.htm -o app_offline.htm; bye"

      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST }}
          username: ${{ vars.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: publish/
          server-dir: ${{ vars.FTP_DIR }}/
          exclude: |
            App_Data/**
            logs/**

      - name: Bring the site back
        if: always()
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "${{ vars.FTP_USER }},$FTP_PASSWORD" "${{ vars.FTP_HOST }}" -e "set ftp:ssl-force true; set ssl:verify-certificate true; cd ${{ vars.FTP_DIR }}; rm -f app_offline.htm; bye"

      - name: Startup log (temporary)
        if: always()
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -s -o /dev/null --resolve lanternfall.bockersoftware.dk:80:94.231.106.196 -A "Mozilla/5.0 Chrome/130" http://lanternfall.bockersoftware.dk/ || true
          sleep 5
          lftp -u "${{ vars.FTP_USER }},$FTP_PASSWORD" "${{ vars.FTP_HOST }}" -e "set ftp:ssl-force true; cd ${{ vars.FTP_DIR }}/logs; ls; mget -O /tmp/lflogs *; bye" || true
          for f in /tmp/lflogs/*; do echo "== $f"; cat "$f"; done; echo "" || true
